# Dev settings. Compose loads this file automatically.
# Start once: docker compose up --build
#
# Hot-reload:
#   web    - Django runserver reloads when a .py file changes.
#   worker - watchfiles restarts Celery when a .py file changes.
#   beat   - watchfiles restarts Celery beat when a .py file changes.
#   realtime - Uvicorn reloads when a .py file changes.
#   streamer - Docker restarts the feed if it exits. After code edits, restart it manually.
# Rebuild (docker compose up --build) only when pyproject.toml or uv.lock changes.
#
# Open https://localhost/ . Caddy makes a local certificate (see the README to trust it).
# Every port is bound to 127.0.0.1, so only this computer can reach the services.
# Port 8000 is a direct way to Django. It skips Caddy, so use it only to debug. It has no
# /ws/ live quotes: those go through Caddy to the realtime service.

services:
  caddy:
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:443:443/udp" # HTTP/3
    environment:
      SITE_ADDRESS: localhost # Caddy signs the certificate with its own local CA.
      OLD_SITE_ADDRESS: old.localhost
      ACME_EMAIL: dev@localhost # Not used for "localhost", but the Caddyfile needs a value.
      ADMIN_ALLOWED_IPS: "0.0.0.0/0 ::/0"
      DOCS_ALLOWED_IPS: "0.0.0.0/0 ::/0"
      # Report only: the Django debug pages use inline styles, and the policy must not block them.
      CSP_HEADER: Content-Security-Policy-Report-Only

  web:
    build:
      args:
        INSTALL_DEV: "true"
    env_file: .env.dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      # Make file change detection work on Docker Desktop (Mac and Windows).
      WATCHFILES_FORCE_POLLING: "true"
      DJANGO_VITE_DEV_MODE: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm dev --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - ./static/css/brand-tokens.css:/app/static/css/brand-tokens.css:ro
      - frontend_node_modules:/app/frontend/node_modules

  realtime:
    build:
      args:
        INSTALL_DEV: "true"
    env_file: .env.dev
    command: >
      uvicorn config.asgi:application --host 0.0.0.0 --port 8001
      --proxy-headers --forwarded-allow-ips=* --ws-max-size 16384
      --reload --reload-dir /app/apps --reload-dir /app/config
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app

  streamer:
    build:
      args:
        INSTALL_DEV: "true"
    env_file: .env.dev
    volumes:
      - .:/app

  worker:
    build:
      args:
        INSTALL_DEV: "true"
    env_file: .env.dev
    command: watchfiles --filter python "celery -A config worker -l info" /app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app

  beat:
    build:
      args:
        INSTALL_DEV: "true"
    env_file: .env.dev
    command: >
      watchfiles --filter python
      "celery -A config beat -l info" /app
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - .:/app

  db:
    env_file: .env.dev
    ports:
      - "127.0.0.1:5432:5432"

  silo:
    env_file: .env.dev
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  silo-init:
    env_file: .env.dev

  ollama:
    ports:
      - "127.0.0.1:11434:11434"

volumes:
  frontend_node_modules:
