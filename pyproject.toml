[project]
name = "kash-engine"
version = "0.1.0"
description = "Daily Indian market news report bot with sentiment and IPO scoring."
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "django-stubs>=6.1.1",
    "feedparser>=6.0.14",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "trafilatura>=2.3.0",
    "whitenoise>=6.12.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
    "ty>=0.0.84",
    "watchfiles>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "DJ", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]
"config/settings/dev.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["apps", "tests"]
