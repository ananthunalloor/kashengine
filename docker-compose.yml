# Common services. Dev settings are in docker-compose.override.yml.
# Prod settings are in docker-compose.prod.yml.
#
# Caddy is the way in to the web app, in dev and in prod. Its ports, TLS settings, and
# networks are set per environment.

x-app: &app
  build:
    context: .
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17
    # env_file (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD) is set per environment.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        : "$${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.dev or .env.prod}"
        : "$${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.dev or .env.prod}"
        exec silo server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Creates private buckets once; restarting it never deletes or overwrites existing objects.
  silo-init:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    entrypoint: ["/bin/sh", "/initialize.sh"]
    volumes:
      - ./deploy/silo/initialize.sh:/initialize.sh:ro
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  # Static developer documentation (Docusaurus built into nginx). It has no secrets and no
  # database. Caddy serves it at /docs/. Do not publish a host port.
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        DOCS_URL: "https://${SITE_ADDRESS:-localhost}"
        DOCS_SOURCE_REF: "${DOCS_SOURCE_REF:-main}"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-dev-grafana-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_LOG_MODE: console
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  prometheus:
    image: prom/prometheus:v3
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=https://${SITE_ADDRESS:-localhost}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  glitchtip-db:
    image: postgres:17
    command: ["postgres", "-c", "max_locks_per_transaction=512"]
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-dev-glitchtip-change-me}
    volumes:
      - glitchtip_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip-valkey:
    image: valkey/valkey:9
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  glitchtip:
    image: glitchtip/glitchtip:6
    depends_on:
      glitchtip-db:
        condition: service_healthy
      glitchtip-valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:-dev-glitchtip-change-me}@glitchtip-db:5432/glitchtip
      VALKEY_URL: redis://glitchtip-valkey:6379
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-glitchtip-secret-change-me}
      GLITCHTIP_DOMAIN: https://sentry.${SITE_ADDRESS:-localhost}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@localhost}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_ADMIN: "False"
      ENABLE_OPENAPI: "False"
      GLITCHTIP_ENABLE_MCP: "False"
      GLITCHTIP_ENABLE_DUCKDB: "False"
      SERVER_ROLE: all_in_one
    volumes:
      - glitchtip_uploads:/code/uploads

  # Reverse proxy. Dev and prod use the same image, the same Caddyfile, and the same hardening.
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data # The TLS certificates and keys. Keep this volume.
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
      docs:
        condition: service_healthy

  # No service in this file publishes a port. Dev publishes ports on 127.0.0.1 in
  # docker-compose.override.yml. Prod publishes only Caddy (80 and 443) in docker-compose.prod.yml.
  # The env_file for web, realtime, streamer, worker, and beat is set per environment.
  web:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Browser WebSockets (Django Channels on Uvicorn, ASGI). Caddy sends only /ws/* here; every
  # other request, including the SSE event stream, stays on the WSGI web service.
  realtime:
    <<: *app
    command: >
      uvicorn config.asgi:application --host 0.0.0.0 --port 8001
      --proxy-headers --forwarded-allow-ips=* --ws-max-size 16384
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One Upstox market-data WebSocket (full mode) for mapped companies and the stream indices.
  # It saves the newest values and broadcasts them to `realtime` through Redis. It waits and
  # retries while Upstox is off or has no token, so it is safe to keep running.
  # Keep the feed as the main process: a file-watcher can stay alive after its child fails,
  # preventing Docker's restart policy from recovering the feed.
  streamer:
    <<: *app
    command: python manage.py stream_upstox
    restart: unless-stopped
    stop_signal: SIGTERM
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    # The schedule is in the database (django-celery-beat DatabaseScheduler, set in the settings).
    command: celery -A config beat -l info

volumes:
  postgres_data:
  ollama_data:
  grafana_data:
  prometheus_data:
  glitchtip_db:
  glitchtip_uploads:
  caddy_data:
  caddy_config:
  # Keep this historical volume name so existing MinIO data is reused by Silo.
  minio_data:

networks:
  observability:
