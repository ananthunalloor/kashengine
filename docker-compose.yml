# Common services. Dev settings are in docker-compose.override.yml.
# Prod settings are in docker-compose.prod.yml.

x-app: &app
  build:
    context: .
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17
    # env_file (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD) is set per environment.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  # The env_file for web, worker, and beat is set per environment.
  web:
    <<: *app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    # The schedule file is in /tmp, because the app user can write there.
    command: celery -A config beat -l info -s /tmp/celerybeat-schedule

volumes:
  postgres_data:
  ollama_data:
