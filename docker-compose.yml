# Common services. Dev settings are in docker-compose.override.yml.
# Prod settings are in docker-compose.prod.yml.
#
# Caddy is the way in to the web app, in dev and in prod. Its ports, TLS settings, and
# networks are set per environment.

x-app: &app
  build:
    context: .
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17
    # env_file (POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD) is set per environment.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama

  # The env_file for web, worker, and beat is set per environment.
  # Reverse proxy. Dev and prod use the same image, the same Caddyfile, and the same hardening.
  # Static Docusaurus site. Caddy exposes it under /docs/; do not publish a host port.
  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        DOCS_URL: "https://${SITE_ADDRESS:-localhost}"
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    volumes:
      - ./deploy/caddy:/etc/caddy:ro
      - caddy_data:/data # The TLS certificates and keys. Keep this volume.
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy

      docs:
        condition: service_healthy
  # No service in this file publishes a port. Dev publishes ports on 127.0.0.1 in
  # docker-compose.override.yml. Prod publishes only Caddy (80 and 443) in docker-compose.prod.yml.
  web:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    # The schedule is in the database (django-celery-beat DatabaseScheduler, set in the settings).
    command: celery -A config beat -l info

volumes:
  postgres_data:
  ollama_data:
  caddy_data:
  caddy_config:
