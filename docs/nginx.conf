# Static server for the Docusaurus build. Caddy is the only client.
# The site lives under /docs/ in the image, so the public path and the file path are the same.
# Caddy does not strip the prefix, and no redirect or asset URL needs rewriting.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Redirects stay relative. The browser sees Caddy's host name, not this one.
        absolute_redirect off;
        port_in_redirect off;

        error_page 404 /docs/404.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /docs {
            return 308 /docs/;
        }

        # Docusaurus puts a content hash in each file name under /docs/assets/.
        location /docs/assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # An add_header in a location replaces the headers of the server level. That is why each
        # location includes the security headers itself.
        location /docs/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }

        location / {
            return 404;
        }
    }
}
