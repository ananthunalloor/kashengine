{% load web_extras %}
<div class="mt-3 max-w-2xl">
  <table class="w-full text-sm">
    <thead class="text-left text-muted">
      <tr><th scope="col" class="py-2 pr-4 font-normal">Name</th><th scope="col" class="py-2 pr-4 text-right font-normal">Close</th><th scope="col" class="py-2 text-right font-normal sm:pr-4">Change</th><th scope="col" class="hidden py-2 font-normal sm:table-cell">Day</th></tr>
    </thead>
    <tbody class="divide-y divide-rule border-y border-rule">
      {% for q in quotes %}
      <tr>
        <th scope="row" class="py-2 pr-4 text-left font-medium">{{ q.name }}</th>
        <td class="num py-2 pr-4 text-right">{{ q.close|floatformat:2 }}</td>
        <td class="num py-2 text-right font-medium sm:pr-4 {{ q.change_pct|tone }}">{{ q.change_pct|signed:2 }}%</td>
        <td class="hidden py-2 text-muted sm:table-cell">{{ q.day|date:"j M" }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
