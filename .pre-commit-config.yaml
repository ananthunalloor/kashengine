repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Saved web pages and the built CSS keep their exact bytes.
      - id: end-of-file-fixer
        exclude: ^(gmp\.html|static/css/app\.css|apps/ipos/tests/data/)
      - id: trailing-whitespace
        exclude: ^(gmp\.html|static/css/app\.css|apps/ipos/tests/data/)
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
