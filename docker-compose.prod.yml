# Prod settings. Start with:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# This file does not use the dev override file.
#
# Security model:
# - Only Caddy publishes ports (80 and 443). No other service is reachable from outside.
# - The networks keep the services apart:
#     edge     Caddy only. It has the published ports and can reach the internet (for TLS).
#     proxy    Caddy, web, realtime and docs. No route to the internet.
#     backend  web, realtime, streamer, worker, beat, db, redis, ollama, silo, silo-init.
#              No route to the internet.
#     egress   streamer, worker, beat, ollama. Outbound only: news, quotes (including the
#              Upstox market-data WebSocket), Telegram, model downloads.
# - Every container drops all Linux capabilities and cannot gain new ones.
# - The app containers and Caddy have a read-only root file system (Caddy: see docker-compose.yml).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

# Web, realtime, streamer, worker, and beat run as the "app" user. They write only to the volumes and to /tmp.
x-app-runtime: &app-runtime
  <<: *hardened
  env_file: .env.prod
  read_only: true
  tmpfs:
    - /tmp
  environment:
    XDG_CACHE_HOME: /tmp/cache  # yfinance and other libraries write their cache here.
  volumes:
    - logs:/app/logs

services:
  caddy:
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    # Compose reads these values from .env.prod (use --env-file). Caddy gets only these values,
    # not the database password or the other secrets.
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env.prod (your domain name)}
      OLD_SITE_ADDRESS: ${OLD_SITE_ADDRESS:-old.${SITE_ADDRESS}}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.prod (an email address for certificate notices)}
      ADMIN_ALLOWED_IPS: ${ADMIN_ALLOWED_IPS:-0.0.0.0/0 ::/0}
      DOCS_ALLOWED_IPS: ${DOCS_ALLOWED_IPS:-0.0.0.0/0 ::/0}
      CSP_HEADER: ${CSP_HEADER:-Content-Security-Policy}
    networks:
      - edge
      - proxy

  # Static files only. No secrets, no database, no route to the internet.
  docs:
    <<: *hardened
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - proxy

  web:
    <<: *app-runtime
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 16"
    volumes:
      - logs:/app/logs
      - staticfiles:/app/staticfiles
    networks:
      - proxy
      - backend

  # Browser WebSockets only (/ws/*). No internet route; it reads Redis and the database.
  realtime:
    <<: *app-runtime
    command: >
      uvicorn config.asgi:application --host 0.0.0.0 --port 8001 --workers 2
      --proxy-headers --forwarded-allow-ips=* --ws-max-size 16384
    networks:
      - proxy
      - backend

  # The single Upstox market-data feed. Run only one: Upstox limits connections per token.
  streamer:
    <<: *app-runtime
    command: python manage.py stream_upstox
    networks:
      - backend
      - egress

  worker:
    <<: *app-runtime
    networks:
      - backend
      - egress

  beat:
    <<: *app-runtime
    networks:
      - backend
      - egress

  db:
    <<: *hardened
    env_file: .env.prod
    # The Postgres entrypoint needs these to set the owner of the data folder and to drop root.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - backend

  redis:
    <<: *hardened
    # The Redis entrypoint needs these to set the owner of /data and to drop root.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - backend

  silo:
    <<: *hardened
    env_file: .env.prod
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend

  silo-init:
    <<: *hardened
    env_file: .env.prod
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend

  ollama:
    <<: *hardened
    # It needs the internet only to download models: docker compose exec ollama ollama pull <model>
    networks:
      - backend
      - egress

networks:
  edge: {}
  proxy:
    internal: true
  backend:
    internal: true
  egress: {}

volumes:
  logs:
  staticfiles:
