# Prod settings. Start with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# This file does not use the dev override file.

services:
    web:
        env_file: .env.prod
        restart: unless-stopped
        command: >
            sh -c "python manage.py migrate --noinput &&
                   python manage.py collectstatic --noinput &&
                   gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
        volumes:
            - logs:/app/logs
        # Put Nginx in front of this port. Do not open it to the internet.
        ports:
            - "127.0.0.1:8000:8000"

    worker:
        env_file: .env.prod
        restart: unless-stopped
        volumes:
            - logs:/app/logs

    beat:
        env_file: .env.prod
        restart: unless-stopped
        volumes:
            - logs:/app/logs

    db:
        env_file: .env.prod
        restart: unless-stopped

    redis:
        restart: unless-stopped

    ollama:
        restart: unless-stopped

volumes:
    logs:
